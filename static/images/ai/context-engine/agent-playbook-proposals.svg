<svg xmlns="http://www.w3.org/2000/svg" width="488" height="216" viewBox="0 0 488 216" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Proposal lifecycle: propose, inbox, accepted FAQ, published; or trash</title>
  <desc id="desc">Left to right: propose, then an inbox holding a candidate plus evidence, then accept to create FAQ v1 unpublished, then publish to serve it to agents. Dismissal or inbox expiry moves the proposal to trash; restore returns it to the inbox. By default, the inbox review window is 30 days from the latest qualifying activity, and proposals remain in trash for 30 days.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#56616b" stroke-width="1.5"></path></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#ee0000" stroke-width="1.5"></path></marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" fill="#17242b">
  <rect width="488" height="216" fill="#fff"></rect>

  <rect x="0" y="24" width="80" height="72" rx="8" fill="#fff" stroke="#56616b" stroke-width="1.5"></rect>
  <text x="12" y="48" font-size="14" font-weight="700">Propose</text>
  <path d="M80 60 H104" fill="none" stroke="#56616b" stroke-width="1.5" marker-end="url(#a)"></path>

  <rect x="104" y="24" width="144" height="72" rx="8" fill="#fff" stroke="#56616b" stroke-width="1.5"></rect>
  <text x="116" y="48" font-size="14" font-weight="700">Inbox</text>
  <text x="116" y="66" font-size="12" fill="#56616b">candidate + evidence</text>
  <text x="116" y="86" font-family="Courier New, Courier, monospace" font-size="10" fill="#56616b" letter-spacing="0.5">30 DAYS BY DEFAULT</text>
  <path d="M248 60 H272" fill="none" stroke="#56616b" stroke-width="1.5" marker-end="url(#a)"></path>
  <text x="260" y="14" font-size="11" fill="#56616b" text-anchor="middle">accept</text>

  <rect x="272" y="24" width="84" height="72" rx="8" fill="#fff" stroke="#56616b" stroke-width="1.5"></rect>
  <text x="282" y="48" font-size="14" font-weight="700">FAQ v1</text>
  <text x="282" y="66" font-size="11" fill="#56616b">unpublished</text>
  <path d="M356 60 H380" fill="none" stroke="#ee0000" stroke-width="1.5" marker-end="url(#r)"></path>
  <text x="368" y="14" font-size="11" fill="#56616b" text-anchor="middle">publish</text>

  <rect x="380" y="24" width="108" height="72" rx="8" fill="#fff4f3" stroke="#ee0000" stroke-width="1.5"></rect>
  <text x="392" y="48" font-size="14" font-weight="700">Published</text>
  <text x="392" y="66" font-size="11" fill="#56616b">served to agents</text>

  <path d="M140 96 V160" fill="none" stroke="#56616b" stroke-width="1.5" marker-end="url(#a)"></path>
  <text x="134" y="124" font-size="11" fill="#56616b" text-anchor="end">dismiss or</text>
  <text x="134" y="138" font-size="11" fill="#56616b" text-anchor="end">inbox expiry</text>
  <path d="M212 160 V96" fill="none" stroke="#56616b" stroke-width="1.5" marker-end="url(#a)"></path>
  <text x="218" y="134" font-size="11" fill="#56616b">restore</text>

  <rect x="104" y="160" width="144" height="56" rx="8" fill="#fff" stroke="#56616b" stroke-width="1.5"></rect>
  <text x="116" y="184" font-size="14" font-weight="700">Trash</text>
  <text x="116" y="204" font-family="Courier New, Courier, monospace" font-size="10" fill="#56616b" letter-spacing="0.5">30 DAYS BY DEFAULT</text>
  </g>
</svg>
