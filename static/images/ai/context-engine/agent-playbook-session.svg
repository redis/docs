<svg xmlns="http://www.w3.org/2000/svg" width="480" height="184" viewBox="0 0 480 184" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Agent session: task, discovery by your app, agent turn with MCP tools, reply; all against one playbook</title>
  <desc id="desc">Left to right: a task with input context arrives; your app discovers context through the SDK and receives FAQs and skill previews; the agent turn runs the model with MCP tools and loads a skill on demand; the agent response goes back. Below, one playbook of published entries serves discover_entries from the app and load_skill and fetch_resource from the agent.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#56616b" stroke-width="1.5"></path></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#ee0000" stroke-width="1.5"></path></marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" fill="#17242b">
  <rect width="480" height="184" fill="#fff"></rect>

  <text x="0" y="14" font-family="Courier New, Courier, monospace" font-size="10" fill="#56616b" letter-spacing="0.5">AGENT SESSION</text>

  <rect x="0" y="24" width="96" height="72" rx="8" fill="#fff" stroke="#56616b" stroke-width="1.5"></rect>
  <text x="12" y="48" font-size="14" font-weight="700">Task</text>
  <text x="12" y="66" font-size="11" fill="#56616b">input context</text>
  <path d="M96 60 H120" fill="none" stroke="#56616b" stroke-width="1.5" marker-end="url(#a)"></path>

  <rect x="120" y="24" width="104" height="72" rx="8" fill="#fff" stroke="#56616b" stroke-width="1.5"></rect>
  <text x="132" y="48" font-size="14" font-weight="700">Discover</text>
  <text x="132" y="66" font-size="11" fill="#56616b">your app · SDK</text>
  <text x="132" y="82" font-size="11" fill="#56616b">FAQs + previews</text>
  <path d="M224 60 H248" fill="none" stroke="#56616b" stroke-width="1.5" marker-end="url(#a)"></path>

  <rect x="248" y="24" width="112" height="72" rx="8" fill="#fff" stroke="#56616b" stroke-width="1.5"></rect>
  <text x="260" y="48" font-size="14" font-weight="700">Agent turn</text>
  <text x="260" y="66" font-size="11" fill="#56616b">model · MCP tools</text>
  <text x="260" y="82" font-size="11" fill="#56616b">loads skills</text>
  <path d="M360 60 H384" fill="none" stroke="#56616b" stroke-width="1.5" marker-end="url(#a)"></path>

  <rect x="384" y="24" width="96" height="72" rx="8" fill="#fff" stroke="#56616b" stroke-width="1.5"></rect>
  <text x="396" y="48" font-size="14" font-weight="700">Reply</text>
  <text x="396" y="66" font-size="11" fill="#56616b">agent response</text>

  <path d="M172 98 V138" fill="none" stroke="#ee0000" stroke-width="1.5" marker-start="url(#r)" marker-end="url(#r)"></path>
  <text x="178" y="122" font-family="Courier New, Courier, monospace" font-size="10" fill="#56616b">discover_entries</text>
  <path d="M304 98 V138" fill="none" stroke="#ee0000" stroke-width="1.5" marker-start="url(#r)" marker-end="url(#r)"></path>
  <text x="310" y="116" font-family="Courier New, Courier, monospace" font-size="10" fill="#56616b">load_skill</text>
  <text x="310" y="130" font-family="Courier New, Courier, monospace" font-size="10" fill="#56616b">fetch_resource</text>

  <rect x="120" y="140" width="240" height="44" rx="8" fill="#fff4f3" stroke="#ee0000" stroke-width="1.5"></rect>
  <text x="132" y="167" font-size="14" font-weight="700">Playbook</text>
  <text x="348" y="167" font-size="11" fill="#56616b" text-anchor="end">published entries only</text>
  </g>
