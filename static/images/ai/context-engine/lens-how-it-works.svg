<svg xmlns="http://www.w3.org/2000/svg" width="480" height="164" viewBox="0 0 480 164" role="img" aria-labelledby="title desc">
  <title id="title">How Lens works: your agent and Iris services, the Redis Iris SDK, Lens, and the Lens UI and read API</title>
  <desc id="desc">Left to right: your agent opens a turn, and the Iris services it calls, Agent Memory, Agent Playbooks, and Context Gateway, record their own steps. The Redis Iris SDK exports the turn to Lens, which assembles turns and groups them into sessions. You inspect sessions in the Lens UI or query turns with the read API.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#56616b" stroke-width="1.5"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#ee0000" stroke-width="1.5"/></marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" fill="#17242b">
    <rect width="480" height="164" fill="#fff"/>

    <text x="0" y="14" font-family="Courier New, Courier, monospace" font-size="10" fill="#56616b" letter-spacing="0.5">TRACE A TURN</text>

    <rect x="0" y="24" width="136" height="128" rx="8" fill="#fff" stroke="#56616b" stroke-width="1.5"/>
    <text x="12" y="48" font-size="14" font-weight="700">Your agent</text>
    <text x="12" y="66" font-family="Courier New, Courier, monospace" font-size="10" fill="#56616b">lens.turn()</text>
    <rect x="10" y="78" width="116" height="64" rx="6" fill="#fff4f3" stroke="#ee0000" stroke-width="1"/>
    <text x="20" y="96" font-size="11" fill="#17242b">Agent Memory</text>
    <text x="20" y="113" font-size="11" fill="#17242b">Agent Playbooks</text>
    <text x="20" y="130" font-size="11" fill="#17242b">Context Gateway</text>

    <path d="M136 88 H188" fill="none" stroke="#ee0000" stroke-width="1.5" marker-end="url(#r)"/>
    <text x="162" y="80" font-family="Courier New, Courier, monospace" font-size="10" fill="#56616b" text-anchor="middle">SDK</text>

    <rect x="188" y="44" width="124" height="88" rx="8" fill="#fff" stroke="#56616b" stroke-width="1.5"/>
    <text x="200" y="68" font-size="14" font-weight="700">Lens</text>
    <text x="200" y="88" font-size="11" fill="#56616b">assembles turns</text>
    <text x="200" y="104" font-size="11" fill="#56616b">groups sessions</text>
    <text x="200" y="120" font-size="11" fill="#56616b">by agent</text>

    <path d="M312 70 H364" fill="none" stroke="#56616b" stroke-width="1.5" marker-end="url(#a)"/>
    <path d="M312 108 H364" fill="none" stroke="#56616b" stroke-width="1.5" marker-end="url(#a)"/>

    <rect x="364" y="44" width="116" height="44" rx="8" fill="#fff" stroke="#56616b" stroke-width="1.5"/>
    <text x="376" y="63" font-size="14" font-weight="700">Lens UI</text>
    <text x="376" y="79" font-size="11" fill="#56616b">inspect sessions</text>

    <rect x="364" y="94" width="116" height="44" rx="8" fill="#fff" stroke="#56616b" stroke-width="1.5"/>
    <text x="376" y="113" font-size="14" font-weight="700">Read API</text>
    <text x="376" y="129" font-size="11" fill="#56616b">query turns</text>
  </g>
</svg>
