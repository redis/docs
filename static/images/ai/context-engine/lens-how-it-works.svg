<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 950 245" style="max-width: 950px; background-color: transparent;" role="img" aria-labelledby="title desc">
  <title id="title">How Lens traces a turn</title>
  <desc id="desc">Your agent sends its turns to Lens through the Redis Iris SDK. The Iris services it calls, Agent Memory, Agent Playbooks, and Context Gateway, record their own steps in the same turn. You inspect sessions in the Lens UI or query turns with the read API.</desc>
  <defs>
    <filter id="lens-how-shadow" x="-10%" y="-20%" width="130%" height="160%">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="rgb(185,185,185)" flood-opacity="1"/>
    </filter>
    <marker id="lens-how-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b0b0b"/>
    </marker>
  </defs>
  <g font-family="'trebuchet ms', verdana, arial, sans-serif" font-size="16" fill="#333333">
    <!-- Edges -->
    <g fill="none" stroke="#0b0b0b" stroke-width="1" marker-end="url(#lens-how-arrow)">
      <path d="M 85 88 L 85 180"/>
      <path d="M 160 64 C 300 64 300 129 428 129"/>
      <path d="M 160 206 C 300 206 300 141 428 141" stroke-dasharray="2"/>
      <path d="M 560 129 C 650 129 650 64 738 64"/>
      <path d="M 560 141 C 650 141 650 206 738 206"/>
    </g>

    <!-- Edge labels -->
    <g text-anchor="middle">
      <rect x="62" y="124" width="46" height="22" fill="#ffffff"/>
      <text x="85" y="140">Calls</text>
      <rect x="208" y="86" width="182" height="22" fill="#ffffff"/>
      <text x="299" y="102">Turns, through the SDK</text>
      <rect x="236" y="163" width="126" height="22" fill="#ffffff"/>
      <text x="299" y="179">Their own steps</text>
      <rect x="584" y="86" width="132" height="22" fill="#ffffff"/>
      <text x="650" y="102">Inspect sessions</text>
      <rect x="600" y="163" width="100" height="22" fill="#ffffff"/>
      <text x="650" y="179">Query turns</text>
    </g>

    <!-- Nodes -->
    <g fill="#ffffff" stroke="#ee0000" stroke-width="1" filter="url(#lens-how-shadow)">
      <rect x="10" y="40" width="150" height="48"/>
      <rect x="10" y="182" width="150" height="48"/>
      <rect x="430" y="111" width="130" height="48"/>
      <rect x="740" y="40" width="200" height="48"/>
      <rect x="740" y="182" width="200" height="48"/>
    </g>
    <g text-anchor="middle">
      <text x="85" y="69">Your agent</text>
      <text x="85" y="211">Iris services</text>
      <text x="495" y="140">Lens</text>
      <text x="840" y="69">Lens UI</text>
      <text x="840" y="211">Read API</text>
    </g>
  </g>
</svg>
