<svg xmlns="http://www.w3.org/2000/svg" width="480" height="196" viewBox="0 0 480 196" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Progressive disclosure: discover, load, fetch; context used grows only as the agent asks</title>
  <desc id="desc">Three steps left to right. Discover: discover_entries returns FAQ answers and skill previews. Load skill: load_skill returns instructions for the selected id and version. Fetch file: fetch_resource returns one file by URI. A bar under each step shows context used growing from previews only, to plus instructions, to plus files needed.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#56616b" stroke-width="1.5"></path></marker>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif" fill="#17242b">
  <rect width="480" height="196" fill="#fff"></rect>

  <text x="0" y="14" font-family="Courier New, Courier, monospace" font-size="10" fill="#56616b" letter-spacing="0.5">1 · DISCOVER</text>
  <rect x="0" y="24" width="136" height="96" rx="8" fill="#fff" stroke="#56616b" stroke-width="1.5"></rect>
  <text x="12" y="46" font-size="14" font-weight="700">Discover</text>
  <text x="12" y="66" font-family="Courier New, Courier, monospace" font-size="11" font-weight="700">discover_entries</text>
  <text x="12" y="88" font-size="12" fill="#56616b">FAQ answers and</text>
  <text x="12" y="104" font-size="12" fill="#56616b">skill previews</text>
  <path d="M136 72 H172" fill="none" stroke="#56616b" stroke-width="1.5" marker-end="url(#a)"></path>

  <text x="172" y="14" font-family="Courier New, Courier, monospace" font-size="10" fill="#56616b" letter-spacing="0.5">2 · LOAD</text>
  <rect x="172" y="24" width="136" height="96" rx="8" fill="#fff" stroke="#56616b" stroke-width="1.5"></rect>
  <text x="184" y="46" font-size="14" font-weight="700">Load skill</text>
  <text x="184" y="66" font-family="Courier New, Courier, monospace" font-size="11" font-weight="700">load_skill</text>
  <text x="184" y="88" font-size="12" fill="#56616b">Instructions for the</text>
  <text x="184" y="104" font-size="12" fill="#56616b">selected version</text>
  <path d="M308 72 H344" fill="none" stroke="#56616b" stroke-width="1.5" marker-end="url(#a)"></path>

  <text x="344" y="14" font-family="Courier New, Courier, monospace" font-size="10" fill="#56616b" letter-spacing="0.5">3 · FETCH</text>
  <rect x="344" y="24" width="136" height="96" rx="8" fill="#fff" stroke="#56616b" stroke-width="1.5"></rect>
  <text x="356" y="46" font-size="14" font-weight="700">Fetch file</text>
  <text x="356" y="66" font-family="Courier New, Courier, monospace" font-size="11" font-weight="700">fetch_resource</text>
  <text x="356" y="88" font-size="12" fill="#56616b">One file by URI</text>

  <text x="0" y="152" font-family="Courier New, Courier, monospace" font-size="10" fill="#56616b" letter-spacing="0.5">CONTEXT USED</text>
  <rect x="0" y="160" width="36" height="12" rx="2" fill="#ee0000"></rect>
  <rect x="172" y="160" width="88" height="12" rx="2" fill="#ee0000"></rect>
  <rect x="344" y="160" width="136" height="12" rx="2" fill="#ee0000"></rect>
  <text x="0" y="190" font-size="12" fill="#56616b">Previews only</text>
  <text x="172" y="190" font-size="12" fill="#56616b">+ instructions</text>
  <text x="344" y="190" font-size="12" fill="#56616b">+ files needed</text>
  </g>
</svg>