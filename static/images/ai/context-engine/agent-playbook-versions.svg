<svg xmlns="http://www.w3.org/2000/svg" width="480" height="226" viewBox="0 0 480 226" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Version lifecycle: operator steps and what agents retrieve</title>
  <desc id="desc">Six operator steps left to right: create entry, publish v1, append v2, publish v2, publish v1, withdraw. Two rows show versions v1 and v2; a red cell is the published version and an outlined cell is an unpublished draft or history. Below, agents retrieve: nothing, v1, v1, v2, v1, nothing.</desc>
  <g font-family="Arial, Helvetica, sans-serif" fill="#17242b">
  <rect width="480" height="226" fill="#fff"></rect>

  <text x="0" y="14" font-family="Courier New, Courier, monospace" font-size="10" fill="#56616b" letter-spacing="0.5">OPERATOR STEPS</text>
  <text x="40" y="38" font-size="12" font-weight="700" text-anchor="middle">Create entry</text>
  <text x="120" y="38" font-size="12" font-weight="700" text-anchor="middle">Publish v1</text>
  <text x="200" y="38" font-size="12" font-weight="700" text-anchor="middle">Append v2</text>
  <text x="280" y="38" font-size="12" font-weight="700" text-anchor="middle">Publish v2</text>
  <text x="360" y="38" font-size="12" font-weight="700" text-anchor="middle">Publish v1</text>
  <text x="440" y="38" font-size="12" font-weight="700" text-anchor="middle">Withdraw</text>

  <rect x="4" y="52" width="72" height="28" rx="4" fill="#fff" stroke="#56616b" stroke-width="1.5"></rect><text x="40" y="71" font-family="Courier New, Courier, monospace" font-size="12" font-weight="700" text-anchor="middle">v1</text>

  <rect x="84" y="52" width="72" height="28" rx="4" fill="#ee0000"></rect><text x="120" y="71" font-family="Courier New, Courier, monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">v1</text>

  <rect x="164" y="52" width="72" height="28" rx="4" fill="#ee0000"></rect><text x="200" y="71" font-family="Courier New, Courier, monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">v1</text>
  <rect x="164" y="88" width="72" height="28" rx="4" fill="#fff" stroke="#56616b" stroke-width="1.5"></rect><text x="200" y="107" font-family="Courier New, Courier, monospace" font-size="12" font-weight="700" text-anchor="middle">v2</text>

  <rect x="244" y="52" width="72" height="28" rx="4" fill="#fff" stroke="#56616b" stroke-width="1.5"></rect><text x="280" y="71" font-family="Courier New, Courier, monospace" font-size="12" font-weight="700" text-anchor="middle">v1</text>
  <rect x="244" y="88" width="72" height="28" rx="4" fill="#ee0000"></rect><text x="280" y="107" font-family="Courier New, Courier, monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">v2</text>

  <rect x="324" y="52" width="72" height="28" rx="4" fill="#ee0000"></rect><text x="360" y="71" font-family="Courier New, Courier, monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">v1</text>
  <rect x="324" y="88" width="72" height="28" rx="4" fill="#fff" stroke="#56616b" stroke-width="1.5"></rect><text x="360" y="107" font-family="Courier New, Courier, monospace" font-size="12" font-weight="700" text-anchor="middle">v2</text>

  <rect x="404" y="52" width="72" height="28" rx="4" fill="#fff" stroke="#56616b" stroke-width="1.5"></rect><text x="440" y="71" font-family="Courier New, Courier, monospace" font-size="12" font-weight="700" text-anchor="middle">v1</text>
  <rect x="404" y="88" width="72" height="28" rx="4" fill="#fff" stroke="#56616b" stroke-width="1.5"></rect><text x="440" y="107" font-family="Courier New, Courier, monospace" font-size="12" font-weight="700" text-anchor="middle">v2</text>

  <path d="M0 134 H480" stroke="#cbd1d5" stroke-width="1"></path>

  <text x="0" y="154" font-family="Courier New, Courier, monospace" font-size="10" fill="#56616b" letter-spacing="0.5">AGENTS RETRIEVE</text>
  <rect x="4" y="162" width="72" height="28" rx="4" fill="#f7f8f9"></rect><text x="40" y="180" font-size="12" fill="#56616b" text-anchor="middle">nothing</text>
  <rect x="84" y="162" width="72" height="28" rx="4" fill="#fff4f3"></rect><text x="120" y="180" font-size="12" font-weight="700" fill="#ee0000" text-anchor="middle">v1</text>
  <rect x="164" y="162" width="72" height="28" rx="4" fill="#fff4f3"></rect><text x="200" y="180" font-size="12" font-weight="700" fill="#ee0000" text-anchor="middle">v1</text>
  <rect x="244" y="162" width="72" height="28" rx="4" fill="#fff4f3"></rect><text x="280" y="180" font-size="12" font-weight="700" fill="#ee0000" text-anchor="middle">v2</text>
  <rect x="324" y="162" width="72" height="28" rx="4" fill="#fff4f3"></rect><text x="360" y="180" font-size="12" font-weight="700" fill="#ee0000" text-anchor="middle">v1</text>
  <rect x="404" y="162" width="72" height="28" rx="4" fill="#f7f8f9"></rect><text x="440" y="180" font-size="12" fill="#56616b" text-anchor="middle">nothing</text>

  <rect x="4" y="208" width="16" height="12" rx="2" fill="#ee0000"></rect><text x="26" y="218" font-size="11" fill="#56616b">published</text>
  <rect x="96" y="208" width="16" height="12" rx="2" fill="#fff" stroke="#56616b" stroke-width="1.5"></rect><text x="118" y="218" font-size="11" fill="#56616b">unpublished draft or history</text>
  </g>
</svg>