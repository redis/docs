<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ts-purple" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 z" fill="#7D3C98"/>
    </marker>
    <marker id="ts-blue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3 L0,6 z" fill="#2E86C1"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">A partition is a sequence of segments, oldest to newest</text>

  <!-- offload annotation (above strip) -->
  <path d="M468,96 Q384,54 300,96" fill="none" stroke="#7D3C98" stroke-width="1.6" marker-end="url(#ts-purple)"/>
  <text x="384" y="50" text-anchor="middle" font-size="12.5" fill="#7D3C98">storage worker seals &amp; offloads sealed segments</text>

  <!-- segment strip -->
  <g>
    <rect x="60"  y="104" width="160" height="78" fill="#FADBD8" stroke="#C0392B" stroke-width="1"/>
    <rect x="220" y="104" width="160" height="78" fill="#FADBD8" stroke="#C0392B" stroke-width="1"/>
    <rect x="380" y="104" width="160" height="78" fill="#FCF3CF" stroke="#B7950B" stroke-width="1"/>
    <rect x="540" y="104" width="160" height="78" fill="#FEF9E7" stroke="#B7950B" stroke-width="2.5"/>

    <text x="140" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Segment 0</text>
    <text x="140" y="158" text-anchor="middle" font-size="12.5" fill="#C0392B">offloaded</text>
    <text x="300" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Segment 1</text>
    <text x="300" y="158" text-anchor="middle" font-size="12.5" fill="#C0392B">offloaded</text>
    <text x="460" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Segment 2</text>
    <text x="460" y="158" text-anchor="middle" font-size="12.5" fill="#9A7D0A">sealed</text>
    <text x="620" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Segment 3</text>
    <text x="620" y="158" text-anchor="middle" font-size="12.5" fill="#9A7D0A">open · current writes</text>
  </g>

  <!-- tier boundary -->
  <line x1="380" y1="98" x2="380" y2="212" stroke="#555" stroke-width="1.2" stroke-dasharray="5,4"/>

  <!-- tier brackets + labels (below strip) -->
  <path d="M62,202 L62,196 L378,196 L378,202" fill="none" stroke="#C0392B" stroke-width="1.4"/>
  <text x="220" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#C0392B">Remote tier</text>
  <text x="220" y="237" text-anchor="middle" font-size="12" fill="#7a2a20">Apache Iceberg on object storage</text>

  <path d="M382,202 L382,196 L698,196 L698,202" fill="none" stroke="#B7950B" stroke-width="1.4"/>
  <text x="540" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#9A7D0A">Local tier</text>
  <text x="540" y="237" text-anchor="middle" font-size="12" fill="#6e5908">Redis Streams</text>

  <!-- produce arrow into open segment -->
  <path d="M620,290 L620,186" fill="none" stroke="#2E86C1" stroke-width="1.6" marker-end="url(#ts-blue)"/>
  <text x="620" y="306" text-anchor="middle" font-size="12.5" fill="#2E86C1">producer appends (XADD)</text>

  <!-- reads note -->
  <text x="60" y="290" font-size="12.5" fill="#444">The broker serves reads across both tiers — consumers never see the boundary.</text>

  <!-- footnote -->
  <text x="60" y="336" font-size="12" font-style="italic" fill="#777">Redis-only topics (the default) keep a single stream per partition, with no segments.</text>
</svg>
