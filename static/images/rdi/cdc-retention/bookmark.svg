<svg xmlns="http://www.w3.org/2000/svg" width="480" height="824" viewBox="0 0 480 824" role="img" aria-labelledby="title desc">
<title id="title">A bookmark needs its history</title>
<desc id="desc">Illustrative Friday-to-Sunday interruption. A red bookmark marks the saved capture position. Solid dark blocks show retained history; hatched blocks show removed history. The first timeline can resume. The second cannot resume because required history is missing.</desc>
<defs><pattern id="removed" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#F9F9F9"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#B9C2C6" stroke-width="1"/></pattern></defs>
<style>@font-face{font-family:"CDC Space Grotesk";font-style:normal;font-weight:300 700;src:url(data:font/woff2;base64,) format("woff2");}</style>
<rect x=".5" y=".5" width="479" height="823" rx="16" fill="#FFFFFF" stroke="#E8EBEC"/>
<path d="M16 0H464Q480 0 480 16V120H0V16Q0 0 16 0Z" fill="#091A23"/>
<g font-family="CDC Space Grotesk, Arial, sans-serif">
<rect x="24" y="23" width="32" height="4" fill="#FF4438"/>
<text x="68" y="30" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="1.4">RDI / SOURCE HISTORY</text>
<text x="24" y="68" font-size="29" font-weight="600" fill="#FFFFFF" text-anchor="start">A bookmark needs history</text>
<text x="24" y="98" font-size="17" font-weight="400" fill="#B9C2C6" text-anchor="start">Saved position ≠ saved history</text>
<g transform="translate(0 132)">
<rect x="24" y="22" width="32" height="32" rx="6" fill="#DCFF1E"/>
<text x="40" y="45" font-size="16" font-weight="600" fill="#091A23" text-anchor="middle">01</text>
<text x="68" y="44" font-size="25" font-weight="600" fill="#091A23" text-anchor="start">History retained</text>
<text x="68" y="70" font-size="18" font-weight="500" fill="#5C707A" text-anchor="start">Resume succeeds</text>
<text x="24" y="105" font-size="17" font-weight="600" fill="#091A23" text-anchor="start">Saved offset</text>
<text x="456" y="105" font-size="17" font-weight="600" fill="#091A23" text-anchor="end">Restart</text>
<rect x="24" y="128" width="24" height="32" fill="url(#removed)" stroke="#B9C2C6"/>
<rect x="48" y="128" width="408" height="32" fill="#163341"/>
<path d="M80 132V156" fill="none" stroke="#5C707A" stroke-width="1"/>
<path d="M112 132V156" fill="none" stroke="#5C707A" stroke-width="1"/>
<path d="M144 132V156" fill="none" stroke="#5C707A" stroke-width="1"/>
<path d="M176 132V156" fill="none" stroke="#5C707A" stroke-width="1"/>
<path d="M208 132V156" fill="none" stroke="#5C707A" stroke-width="1"/>
<path d="M240 132V156" fill="none" stroke="#5C707A" stroke-width="1"/>
<path d="M272 132V156" fill="none" stroke="#5C707A" stroke-width="1"/>
<path d="M304 132V156" fill="none" stroke="#5C707A" stroke-width="1"/>
<path d="M336 132V156" fill="none" stroke="#5C707A" stroke-width="1"/>
<path d="M368 132V156" fill="none" stroke="#5C707A" stroke-width="1"/>
<path d="M400 132V156" fill="none" stroke="#5C707A" stroke-width="1"/>
<path d="M432 132V156" fill="none" stroke="#5C707A" stroke-width="1"/>
<path d="M112 112V168" fill="none" stroke="#D52D1F" stroke-width="2"/>
<path d="M103 116H121V139L112 133L103 139Z" fill="#FF4438" stroke="#091A23" stroke-width="1"/>
<path d="M444 112V168" fill="none" stroke="#091A23" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="276" y="185" font-size="16" font-weight="500" fill="#091A23" text-anchor="middle">Change history</text>
<path d="M112 211H444M438 207L444 211L438 215" fill="none" stroke="#5C707A" stroke-width="1.3"/>
<text x="112" y="236" font-size="16" font-weight="500" fill="#5C707A" text-anchor="middle">Friday</text>
<text x="444" y="236" font-size="16" font-weight="500" fill="#5C707A" text-anchor="end">Sunday</text>
<text x="277" y="236" font-size="15" font-weight="400" fill="#5C707A" text-anchor="middle">Source keeps writing</text>
<circle cx="35" cy="264" r="11" fill="#DCFF1E"/>
<path d="M30 264L34 268L41 260" fill="none" stroke="#091A23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="270" font-size="17" font-weight="500" fill="#091A23" text-anchor="start">Required changes remain available.</text>
<text x="56" y="291" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">RDI resumes from its saved position.</text>
</g>
<g transform="translate(0 452)">
<path d="M24 0H456" fill="none" stroke="#E8EBEC" stroke-width="1"/>
<rect x="24" y="22" width="32" height="32" rx="6" fill="#091A23"/>
<text x="40" y="45" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">02</text>
<text x="68" y="44" font-size="25" font-weight="600" fill="#091A23" text-anchor="start">History removed</text>
<text x="68" y="70" font-size="18" font-weight="500" fill="#D52D1F" text-anchor="start">Cannot resume</text>
<text x="24" y="105" font-size="17" font-weight="600" fill="#091A23" text-anchor="start">Saved offset</text>
<text x="456" y="105" font-size="17" font-weight="600" fill="#091A23" text-anchor="end">Restart</text>
<rect x="24" y="128" width="240" height="32" fill="url(#removed)" stroke="#B9C2C6"/>
<rect x="264" y="128" width="192" height="32" fill="#163341"/>
<path d="M296 132V156" fill="none" stroke="#5C707A" stroke-width="1"/>
<path d="M328 132V156" fill="none" stroke="#5C707A" stroke-width="1"/>
<path d="M360 132V156" fill="none" stroke="#5C707A" stroke-width="1"/>
<path d="M392 132V156" fill="none" stroke="#5C707A" stroke-width="1"/>
<path d="M424 132V156" fill="none" stroke="#5C707A" stroke-width="1"/>
<path d="M112 112V168" fill="none" stroke="#D52D1F" stroke-width="2"/>
<path d="M103 116H121V139L112 133L103 139Z" fill="#FF4438" stroke="#091A23" stroke-width="1"/>
<path d="M444 112V168" fill="none" stroke="#091A23" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="180" y="185" font-size="16" font-weight="500" fill="#5C707A" text-anchor="middle">Removed</text>
<text x="360" y="185" font-size="16" font-weight="500" fill="#091A23" text-anchor="middle">Retained</text>
<path d="M112 211H444M438 207L444 211L438 215" fill="none" stroke="#5C707A" stroke-width="1.3"/>
<text x="112" y="236" font-size="16" font-weight="500" fill="#5C707A" text-anchor="middle">Friday</text>
<text x="444" y="236" font-size="16" font-weight="500" fill="#5C707A" text-anchor="end">Sunday</text>
<text x="277" y="236" font-size="15" font-weight="400" fill="#5C707A" text-anchor="middle">Source keeps writing</text>
<circle cx="35" cy="264" r="11" fill="#D52D1F"/>
<path d="M31 260L39 268M39 260L31 268" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="270" font-size="17" font-weight="500" fill="#091A23" text-anchor="start">Required changes have been removed.</text>
<text x="56" y="291" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">The offset cannot recreate the gap.</text>
</g>
<path d="M24 772H456" fill="none" stroke="#E8EBEC" stroke-width="1"/>
<text x="24" y="802" font-size="16" font-weight="400" fill="#5C707A" text-anchor="start">Illustrative times · not retention defaults</text>
</g>
</svg>
