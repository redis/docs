<text x="68" y="44" font-size="24" font-weight="600" fill="#091A23" text-anchor="start">A different source</text>
<text x="68" y="70" font-size="17" font-weight="400" fill="#5C707A" text-anchor="start">Same table rows ≠ same log positions</text>
