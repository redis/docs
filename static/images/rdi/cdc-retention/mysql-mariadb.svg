<path d="M80 111V137" fill="none" stroke="#D52D1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M72 114H88V135L80 129L72 135Z" fill="#FF4438" stroke="#091A23"/>
