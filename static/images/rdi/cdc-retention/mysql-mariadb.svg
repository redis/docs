<path d="M233 159V180" fill="none" stroke="#D52D1F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<text x="253" y="176" font-size="16" font-weight="500" fill="#D52D1F" text-anchor="start">No automatic mapping</text>
