<text x="68" y="70" font-size="17" font-weight="400" fill="#5C707A" text-anchor="start">A bookmark names a file and a position</text>
<rect x="24" y="125" width="136" height="58" rx="5" fill="#163341"/>
<text x="92.0" y="160.0" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">File 041</text>
<path d="M163 154H170M164 150L170 154L164 158" fill="none" stroke="#5C707A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
