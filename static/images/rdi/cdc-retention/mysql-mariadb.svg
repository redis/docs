<text x="388.0" y="160.0" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">File 043</text>
<text x="80" y="97" font-size="17" font-weight="600" fill="#091A23" text-anchor="middle">Position</text>
<path d="M80 111V137" fill="none" stroke="#D52D1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M72 114H88V135L80 129L72 135Z" fill="#FF4438" stroke="#091A23"/>
<circle cx="35" cy="215" r="10" fill="#D52D1F"/>
<path d="M31 211L39 219M39 211L31 219" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="221" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">Expiration or purge removes needed events.</text>
<text x="56" y="244" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">A log reset can remove the whole chain.</text>
</g>
<g transform="translate(0 686)">
