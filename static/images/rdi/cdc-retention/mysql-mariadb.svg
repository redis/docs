<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1070" viewBox="0 0 480 1070" role="img" aria-labelledby="title desc">
<title id="title">MySQL and MariaDB: Files, positions, and source changes</title>
<desc id="desc">Normal binary-log rotation keeps the saved file position usable while required files remain. Purging the required file removes its events. Switching to another server is a different case: file names and positions belong to that server’s history.</desc>
<defs><pattern id="removed" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#F9F9F9"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#B9C2C6" stroke-width="1"/></pattern></defs>
<style>@font-face{font-family:"CDC Space Grotesk";font-style:normal;font-weight:300 700;src:url(data:font/woff2;base64,) format("woff2");}</style>
<rect x=".5" y=".5" width="479" height="1069" rx="16" fill="#FFFFFF" stroke="#E8EBEC"/>
<path d="M16 0H464Q480 0 480 16V120H0V16Q0 0 16 0Z" fill="#091A23"/>
<g font-family="CDC Space Grotesk, Arial, sans-serif">
