<svg xmlns="http://www.w3.org/2000/svg" width="480" height="489" viewBox="0 0 480 489" role="img" aria-labelledby="title desc">
<title id="title">MongoDB: A valid token is only one dependency</title>
<desc id="desc">For custom Redis keys, RDI can need document pre-images. An event can remain in the oplog while its pre-image has expired or was never enabled. Resumable history does not guarantee availability of the old document values.</desc>
<defs><pattern id="removed" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#F9F9F9"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#B9C2C6" stroke-width="1"/></pattern></defs>
<style>@font-face{font-family:"CDC Space Grotesk";font-style:normal;font-weight:300 700;src:url(data:font/woff2;base64,) format("woff2");}</style>
<rect x=".5" y=".5" width="479" height="488" rx="16" fill="#FFFFFF" stroke="#E8EBEC"/>
<path d="M16 0H464Q480 0 480 16V120H0V16Q0 0 16 0Z" fill="#091A23"/>
<g font-family="CDC Space Grotesk, Arial, sans-serif">
<rect x="24" y="23" width="32" height="4" rx="0" fill="#FF4438"/>
<text x="68" y="30" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="1.4">RDI / SOURCE HISTORY</text>
<text x="24" y="68" font-size="32" font-weight="600" fill="#FFFFFF" text-anchor="start">MongoDB</text>
<text x="24" y="98" font-size="18" font-weight="400" fill="#B9C2C6" text-anchor="start">A valid token is only one dependency</text>
<g transform="translate(0 132)">
<rect x="24" y="22" width="32" height="32" rx="6" fill="#091A23"/>
<text x="40" y="45" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">01</text>
<text x="68" y="44" font-size="24" font-weight="600" fill="#091A23" text-anchor="start">Old values have their own lifetime</text>
<text x="68" y="70" font-size="17" font-weight="400" fill="#5C707A" text-anchor="start">Custom keys can need document pre-images</text>
<text x="24" y="112" font-size="18" font-weight="600" fill="#091A23" text-anchor="start">Oplog</text>
<rect x="160" y="88" width="296" height="50" rx="5" fill="#163341"/>
<text x="308.0" y="119.0" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">Event still available</text>
<text x="24" y="188" font-size="18" font-weight="600" fill="#091A23" text-anchor="start">Pre-images</text>
<rect x="160" y="164" width="296" height="50" rx="5" fill="url(#removed)" stroke="#B9C2C6"/>
<text x="308.0" y="195.0" font-size="17" font-weight="500" fill="#091A23" text-anchor="middle">Old value no longer available</text>
<path d="M308 142V160" fill="none" stroke="#D52D1F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<circle cx="35" cy="249" r="10" fill="#D52D1F"/>
<path d="M31 245L39 253M39 245L31 253" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="255" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">A usable token does not restore old values.</text>
<text x="56" y="278" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">Plan pre-image retention for custom keys.</text>
</g>
<path d="M24 437H456" fill="none" stroke="#E8EBEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="467" font-size="16" font-weight="400" fill="#5C707A" text-anchor="start">Illustrations · not retention defaults</text>
</g>
</svg>
