<svg xmlns="http://www.w3.org/2000/svg" width="480" height="602" viewBox="0 0 480 602" role="img" aria-labelledby="title desc">
<title id="title">Oracle: A running reader can have an old bookmark</title>
<desc id="desc">A transaction starts on Thursday and stays open through Sunday. Other transactions commit on Friday and Saturday. The restart position can remain in Thursday redo. If cleanup removes that redo before a restart, recent activity does not make the restart safe.</desc>
<defs><pattern id="removed" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#F9F9F9"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#B9C2C6" stroke-width="1"/></pattern></defs>
<style>@font-face{font-family:"CDC Space Grotesk";font-style:normal;font-weight:300 700;src:url(data:font/woff2;base64,) format("woff2");}</style>
<rect x=".5" y=".5" width="479" height="601" rx="16" fill="#FFFFFF" stroke="#E8EBEC"/>
<path d="M16 0H464Q480 0 480 16V120H0V16Q0 0 16 0Z" fill="#091A23"/>
<g font-family="CDC Space Grotesk, Arial, sans-serif">
<rect x="24" y="23" width="32" height="4" rx="0" fill="#FF4438"/>
<text x="68" y="30" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="1.4">RDI / SOURCE HISTORY</text>
<text x="24" y="68" font-size="32" font-weight="600" fill="#FFFFFF" text-anchor="start">Oracle</text>
<text x="24" y="98" font-size="18" font-weight="400" fill="#B9C2C6" text-anchor="start">A running reader can have an old bookmark</text>
<g transform="translate(0 132)">
<rect x="24" y="22" width="32" height="32" rx="6" fill="#091A23"/>
<text x="40" y="45" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">01</text>
<text x="68" y="44" font-size="24" font-weight="600" fill="#091A23" text-anchor="start">An old restart position</text>
<text x="68" y="70" font-size="17" font-weight="400" fill="#5C707A" text-anchor="start">Example: a long-running transaction</text>
<text x="24" y="111" font-size="18" font-weight="600" fill="#091A23" text-anchor="start">Transaction stays open</text>
<rect x="64" y="134" width="360" height="26" rx="3" fill="#163341"/>
<path d="M67 147H440M434 143L440 147L434 151" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M64 121V171" fill="none" stroke="#D52D1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M56 124H72V145L64 139L56 145Z" fill="#FF4438" stroke="#091A23"/>
<text x="64" y="187" font-size="17" font-weight="500" fill="#5C707A" text-anchor="middle">Thu</text>
<text x="184" y="187" font-size="17" font-weight="500" fill="#5C707A" text-anchor="middle">Fri</text>
<text x="304" y="187" font-size="17" font-weight="500" fill="#5C707A" text-anchor="middle">Sat</text>
<text x="424" y="187" font-size="17" font-weight="500" fill="#5C707A" text-anchor="middle">Sun</text>
<text x="24" y="222" font-size="18" font-weight="600" fill="#091A23" text-anchor="start">Other transactions commit</text>
<rect x="179" y="238" width="10" height="10" rx="2" fill="#DCFF1E" stroke="#091A23"/>
<rect x="235" y="238" width="10" height="10" rx="2" fill="#DCFF1E" stroke="#091A23"/>
<rect x="299" y="238" width="10" height="10" rx="2" fill="#DCFF1E" stroke="#091A23"/>
<rect x="355" y="238" width="10" height="10" rx="2" fill="#DCFF1E" stroke="#091A23"/>
<text x="24" y="286" font-size="18" font-weight="600" fill="#091A23" text-anchor="start">Redo available at restart</text>
<rect x="24" y="303" width="180" height="28" rx="0" fill="url(#removed)" stroke="#B9C2C6"/>
<rect x="204" y="303" width="252" height="28" rx="0" fill="#163341"/>
<path d="M64 292V342" fill="none" stroke="#D52D1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M56 295H72V316L64 310L56 316Z" fill="#FF4438" stroke="#091A23"/>
<text x="120" y="355" font-size="17" font-weight="500" fill="#D52D1F" text-anchor="middle">Required redo gone</text>
<text x="338" y="355" font-size="17" font-weight="500" fill="#091A23" text-anchor="middle">Newer redo remains</text>
<circle cx="35" cy="380" r="10" fill="#D52D1F"/>
<path d="M31 376L39 384M39 376L31 384" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="386" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">Recent events do not prove restart safety.</text>
</g>
<path d="M24 550H456" fill="none" stroke="#E8EBEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="580" font-size="16" font-weight="400" fill="#5C707A" text-anchor="start">Illustrations · not retention defaults</text>
</g>
</svg>
