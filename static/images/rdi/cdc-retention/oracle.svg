<svg xmlns="http://www.w3.org/2000/svg" width="480" height="750" viewBox="0 0 480 750" role="img" aria-labelledby="title desc">
<title id="title">Oracle: The whole redo chain must be readable</title>
<desc id="desc">A saved SCN points into archive 101. A complete chain through archives 102 and 103 allows mining. A missing or inaccessible archive 102 interrupts that chain even if archive 101 and newer files exist.</desc>
