<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1038" viewBox="0 0 480 1038" role="img" aria-labelledby="title desc">
<title id="title">SQL Server: Two readers, then a separate cleanup window</title>
<desc id="desc">SQL Server capture copies the transaction log to CDC change tables; RDI reads those tables. Retained CDC rows permit resume. Cleanup can move the oldest available LSN past RDI. Disabling a capture instance deletes its old table independently of the retention window.</desc>
<defs><pattern id="removed" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#F9F9F9"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#B9C2C6" stroke-width="1"/></pattern></defs>
<style>@font-face{font-family:"CDC Space Grotesk";font-style:normal;font-weight:300 700;src:url(data:font/woff2;base64,) format("woff2");}</style>
<rect x=".5" y=".5" width="479" height="1037" rx="16" fill="#FFFFFF" stroke="#E8EBEC"/>
<path d="M16 0H464Q480 0 480 16V120H0V16Q0 0 16 0Z" fill="#091A23"/>
<g font-family="CDC Space Grotesk, Arial, sans-serif">
<rect x="24" y="23" width="32" height="4" rx="0" fill="#FF4438"/>
<text x="68" y="30" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="1.4">RDI / SOURCE HISTORY</text>
<text x="24" y="68" font-size="32" font-weight="600" fill="#FFFFFF" text-anchor="start">SQL Server</text>
<text x="24" y="98" font-size="18" font-weight="400" fill="#B9C2C6" text-anchor="start">Two readers, then a separate cleanup window</text>
<g transform="translate(0 132)">
<rect x="24" y="22" width="32" height="32" rx="6" fill="#DCFF1E"/>
<text x="40" y="45" font-size="16" font-weight="600" fill="#091A23" text-anchor="middle">01</text>
<text x="68" y="44" font-size="24" font-weight="600" fill="#091A23" text-anchor="start">Two readers, two delays</text>
<text x="68" y="70" font-size="17" font-weight="400" fill="#5C707A" text-anchor="start">SQL Server captures first; RDI reads second</text>
<rect x="24" y="115" width="96" height="66" rx="5" fill="#F9F9F9" stroke="#E8EBEC"/>
<text x="72.0" y="144.0" font-size="17" font-weight="500" fill="#091A23" text-anchor="middle">Transaction</text>
<text x="72.0" y="164.0" font-size="17" font-weight="500" fill="#091A23" text-anchor="middle">log</text>
<path d="M123 148H133M127 144L133 148L127 152" fill="none" stroke="#5C707A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="136" y="115" width="96" height="66" rx="5" fill="#F9F9F9" stroke="#E8EBEC"/>
<text x="184.0" y="144.0" font-size="17" font-weight="500" fill="#091A23" text-anchor="middle">SQL Server</text>
<text x="184.0" y="164.0" font-size="17" font-weight="500" fill="#091A23" text-anchor="middle">capture</text>
<path d="M235 148H245M239 144L245 148L239 152" fill="none" stroke="#5C707A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="248" y="115" width="96" height="66" rx="5" fill="#163341"/>
<text x="296.0" y="144.0" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">CDC</text>
<text x="296.0" y="164.0" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">tables</text>
<path d="M347 148H357M351 144L357 148L351 152" fill="none" stroke="#5C707A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="360" y="115" width="96" height="66" rx="5" fill="#F9F9F9" stroke="#E8EBEC"/>
<text x="408.0" y="144.0" font-size="17" font-weight="500" fill="#091A23" text-anchor="middle">RDI</text>
<text x="408.0" y="164.0" font-size="17" font-weight="500" fill="#091A23" text-anchor="middle">reader</text>
<path d="M296 100V126" fill="none" stroke="#D52D1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M288 103H304V124L296 118L288 124Z" fill="#FF4438" stroke="#091A23"/>
<text x="296" y="212" font-size="17" font-weight="600" fill="#091A23" text-anchor="middle">Saved LSN</text>
<circle cx="35" cy="240" r="10" fill="#DCFF1E"/>
<path d="M30 240L34 244L41 236" fill="none" stroke="#091A23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="246" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">Retained CDC rows allow continuation.</text>
</g>
<g transform="translate(0 412)">
<path d="M24 0H456" fill="none" stroke="#E8EBEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="24" y="22" width="32" height="32" rx="6" fill="#091A23"/>
<text x="40" y="45" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">02</text>
<text x="68" y="44" font-size="24" font-weight="600" fill="#091A23" text-anchor="start">Cleanup overtakes RDI</text>
<text x="68" y="70" font-size="17" font-weight="400" fill="#5C707A" text-anchor="start">The available range moves forward</text>
<rect x="24" y="128" width="230" height="36" rx="0" fill="url(#removed)" stroke="#B9C2C6"/>
<rect x="254" y="128" width="202" height="36" rx="0" fill="#163341"/>
<text x="120" y="98" font-size="17" font-weight="600" fill="#091A23" text-anchor="middle">Saved LSN</text>
<path d="M120 112V162" fill="none" stroke="#D52D1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M112 115H128V136L120 130L112 136Z" fill="#FF4438" stroke="#091A23"/>
<path d="M254 116V179" fill="none" stroke="#D52D1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="254" y="207" font-size="17" font-weight="500" fill="#D52D1F" text-anchor="middle">Oldest available row</text>
<path d="M260 112H442M436 108L442 112L436 116" fill="none" stroke="#5C707A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="440" y="101" font-size="16" font-weight="400" fill="#5C707A" text-anchor="end">New changes</text>
<circle cx="35" cy="240" r="10" fill="#D52D1F"/>
<path d="M31 236L39 244M39 236L31 244" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="246" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">Required rows are outside the CDC range.</text>
</g>
<g transform="translate(0 694)">
<path d="M24 0H456" fill="none" stroke="#E8EBEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="24" y="22" width="32" height="32" rx="6" fill="#091A23"/>
<text x="40" y="45" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">03</text>
<text x="68" y="44" font-size="24" font-weight="600" fill="#091A23" text-anchor="start">Capture instance removed</text>
<text x="68" y="70" font-size="17" font-weight="400" fill="#5C707A" text-anchor="start">Maintenance can remove history immediately</text>
<rect x="24" y="110" width="196" height="70" rx="5" fill="url(#removed)" stroke="#B9C2C6"/>
<text x="122.0" y="141.0" font-size="17" font-weight="500" fill="#091A23" text-anchor="middle">Old CDC table</text>
<text x="122.0" y="161.0" font-size="17" font-weight="500" fill="#091A23" text-anchor="middle">Deleted</text>
<rect x="260" y="110" width="196" height="70" rx="5" fill="#163341"/>
<text x="358.0" y="141.0" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">New CDC table</text>
<text x="358.0" y="161.0" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">Starts later</text>
<path d="M100 98V124" fill="none" stroke="#D52D1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M92 101H108V122L100 116L92 122Z" fill="#FF4438" stroke="#091A23"/>
<path d="M226 145H254M248 141L254 145L248 149" fill="none" stroke="#D52D1F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<text x="24" y="214" font-size="17" font-weight="400" fill="#5C707A" text-anchor="start">The retention window did not save these rows.</text>
<circle cx="35" cy="248" r="10" fill="#D52D1F"/>
<path d="M31 244L39 252M39 244L31 252" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="254" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">A replacement does not restore old rows.</text>
</g>
<path d="M24 986H456" fill="none" stroke="#E8EBEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="1016" font-size="16" font-weight="400" fill="#5C707A" text-anchor="start">Illustrations · not retention defaults</text>
</g>
</svg>
