<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1116" viewBox="0 0 480 1116" role="img" aria-labelledby="title desc">
<title id="title">PostgreSQL: History loss and slot loss are different</title>
<desc id="desc">A valid replication slot pins WAL while disk use grows. With a configured slot size limit, a checkpoint can allow required WAL removal. Separately, PostgreSQL 18 can invalidate an inactive slot at a checkpoint after its enabled idle timeout, even if WAL files remain.</desc>
<defs><pattern id="removed" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#F9F9F9"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#B9C2C6" stroke-width="1"/></pattern></defs>
<style>@font-face{font-family:"CDC Space Grotesk";font-style:normal;font-weight:300 700;src:url(data:font/woff2;base64,) format("woff2");}</style>
<rect x=".5" y=".5" width="479" height="1115" rx="16" fill="#FFFFFF" stroke="#E8EBEC"/>
<path d="M16 0H464Q480 0 480 16V120H0V16Q0 0 16 0Z" fill="#091A23"/>
<g font-family="CDC Space Grotesk, Arial, sans-serif">
<rect x="24" y="23" width="32" height="4" rx="0" fill="#FF4438"/>
<text x="68" y="30" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="1.4">RDI / SOURCE HISTORY</text>
<text x="24" y="68" font-size="32" font-weight="600" fill="#FFFFFF" text-anchor="start">PostgreSQL</text>
<text x="24" y="98" font-size="18" font-weight="400" fill="#B9C2C6" text-anchor="start">History loss and slot loss are different</text>
<g transform="translate(0 132)">
<rect x="24" y="22" width="32" height="32" rx="6" fill="#DCFF1E"/>
<text x="40" y="45" font-size="16" font-weight="600" fill="#091A23" text-anchor="middle">01</text>
<text x="68" y="44" font-size="24" font-weight="600" fill="#091A23" text-anchor="start">A slot holds history</text>
<text x="68" y="70" font-size="17" font-weight="400" fill="#5C707A" text-anchor="start">Capture is paused; source writes continue</text>
<rect x="24" y="109" width="120" height="60" rx="5" fill="#DCFF1E"/>
<text x="84.0" y="145.0" font-size="17" font-weight="500" fill="#091A23" text-anchor="middle">Valid slot</text>
<path d="M149 139H194M188 135L194 139L188 143" fill="none" stroke="#5C707A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="200" y="109" width="248" height="60" rx="5" fill="#163341"/>
<text x="324.0" y="145.0" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">Required WAL retained</text>
<text x="24" y="226" font-size="17" font-weight="500" fill="#5C707A" text-anchor="start">Disk used</text>
<rect x="164" y="233" width="30" height="12" rx="2" fill="#163341"/>
<rect x="208" y="223" width="30" height="22" rx="2" fill="#163341"/>
<rect x="252" y="212" width="30" height="33" rx="2" fill="#163341"/>
<rect x="296" y="201" width="30" height="44" rx="2" fill="#163341"/>
<rect x="340" y="190" width="30" height="55" rx="2" fill="#163341"/>
<rect x="384" y="179" width="30" height="66" rx="2" fill="#163341"/>
<path d="M164 257H444M438 253L444 257L438 261" fill="none" stroke="#5C707A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="164" y="279" font-size="15" font-weight="400" fill="#5C707A" text-anchor="start">Outage begins</text>
<text x="444" y="279" font-size="15" font-weight="400" fill="#5C707A" text-anchor="end">Later</text>
<circle cx="35" cy="309" r="10" fill="#DCFF1E"/>
<path d="M30 309L34 313L41 305" fill="none" stroke="#091A23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="315" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">Resume remains possible; disk can fill.</text>
</g>
<g transform="translate(0 472)">
<path d="M24 0H456" fill="none" stroke="#E8EBEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="24" y="22" width="32" height="32" rx="6" fill="#091A23"/>
<text x="40" y="45" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">02</text>
<text x="68" y="44" font-size="24" font-weight="600" fill="#091A23" text-anchor="start">A size limit is exceeded</text>
<text x="68" y="70" font-size="17" font-weight="400" fill="#5C707A" text-anchor="start">PostgreSQL 13+ · only with a finite slot limit</text>
<rect x="24" y="108" width="278" height="30" rx="0" fill="#163341"/>
<rect x="302" y="108" width="146" height="30" rx="0" fill="#FF4438"/>
<path d="M302 96V150" fill="none" stroke="#D52D1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
<text x="302" y="175" font-size="17" font-weight="500" fill="#D52D1F" text-anchor="middle">Configured limit</text>
<rect x="24" y="192" width="132" height="44" rx="5" fill="#F9F9F9" stroke="#E8EBEC"/>
<text x="90.0" y="220.0" font-size="17" font-weight="500" fill="#091A23" text-anchor="middle">Checkpoint</text>
<path d="M162 214H196M190 210L196 214L190 218" fill="none" stroke="#5C707A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="202" y="192" width="246" height="44" rx="5" fill="url(#removed)" stroke="#B9C2C6"/>
<text x="325.0" y="220.0" font-size="17" font-weight="500" fill="#091A23" text-anchor="middle">Required WAL removed</text>
<circle cx="35" cy="262" r="10" fill="#D52D1F"/>
<path d="M31 258L39 266M39 258L31 266" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="268" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">If required WAL is lost, resume fails.</text>
</g>
<g transform="translate(0 768)">
<path d="M24 0H456" fill="none" stroke="#E8EBEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="24" y="22" width="32" height="32" rx="6" fill="#091A23"/>
<text x="40" y="45" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">03</text>
<text x="68" y="44" font-size="24" font-weight="600" fill="#091A23" text-anchor="start">An idle slot times out</text>
<text x="68" y="70" font-size="17" font-weight="400" fill="#5C707A" text-anchor="start">PostgreSQL 18 · disabled by default</text>
<rect x="24" y="108" width="124" height="64" rx="5" fill="#F9F9F9" stroke="#E8EBEC"/>
<text x="86.0" y="136.0" font-size="17" font-weight="500" fill="#091A23" text-anchor="middle">Slot</text>
<text x="86.0" y="156.0" font-size="17" font-weight="500" fill="#091A23" text-anchor="middle">inactive</text>
<path d="M154 140H174M168 136L174 140L168 144" fill="none" stroke="#5C707A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="180" y="108" width="124" height="64" rx="5" fill="#F9F9F9" stroke="#E8EBEC"/>
<text x="242.0" y="136.0" font-size="17" font-weight="500" fill="#091A23" text-anchor="middle">Idle timeout</text>
<text x="242.0" y="156.0" font-size="17" font-weight="500" fill="#091A23" text-anchor="middle">passes</text>
<path d="M310 140H330M324 136L330 140L324 144" fill="none" stroke="#5C707A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="336" y="108" width="112" height="64" rx="5" fill="#F9F9F9" stroke="#E8EBEC"/>
<text x="392.0" y="146.0" font-size="17" font-weight="500" fill="#091A23" text-anchor="middle">Checkpoint</text>
<rect x="24" y="198" width="168" height="42" rx="5" fill="#F9F9F9" stroke="#E8EBEC"/>
<text x="108.0" y="225.0" font-size="17" font-weight="500" fill="#091A23" text-anchor="middle">Slot invalid</text>
<rect x="216" y="198" width="232" height="42" rx="5" fill="#163341"/>
<text x="332.0" y="225.0" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">WAL may still exist</text>
<circle cx="35" cy="266" r="10" fill="#D52D1F"/>
<path d="M31 262L39 270M39 262L31 270" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="272" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">Available WAL alone is not enough.</text>
</g>
<path d="M24 1064H456" fill="none" stroke="#E8EBEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="1094" font-size="16" font-weight="400" fill="#5C707A" text-anchor="start">Illustrations · not retention defaults</text>
</g>
</svg>
