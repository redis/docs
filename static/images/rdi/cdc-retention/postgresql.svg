<svg xmlns="http://www.w3.org/2000/svg" width="480" height="972" viewBox="0 0 480 972" role="img" aria-labelledby="title desc">
<title id="title">PostgreSQL: slots and WAL</title>
<desc id="desc">Time moves from earlier to later. A vertical bookmark marks where capture stopped. In the first panel the required history is retained. In the second panel required history is removed. A third panel shows a slot invalidated by an idle timeout even if WAL remains on disk.</desc>
<defs><pattern id="removed" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f1f5f9"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#94a3b8" stroke-width="1"/></pattern></defs>
<rect width="480" height="100%" rx="12" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#162638">
<text x="20" y="34" font-size="23" font-weight="700" text-anchor="start" fill="#162638">PostgreSQL: slots and WAL</text>
<text x="20" y="62" font-size="17" font-weight="400" text-anchor="start" fill="#475569">Illustration · no fixed expiration time</text>
<rect x="12" y="84" width="456" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="28" y="115" font-size="21" font-weight="700" text-anchor="start" fill="#162638">1  History retained: resume succeeds</text>
<text x="28" y="141" font-size="17" font-weight="400" text-anchor="start" fill="#475569">Capture stops; source writes continue</text>
<rect x="30" y="196" width="30" height="36" fill="url(#removed)" stroke="#94a3b8"/>
<rect x="60" y="196" width="390" height="36" fill="#dbeafe" stroke="#2563a6"/>
<text x="132" y="176" font-size="18" font-weight="700" text-anchor="middle" fill="#162638">Saved position</text>
<path d="M132 183V238" stroke="#162638" stroke-width="3"/>
<circle cx="132" cy="214" r="6" fill="#162638"/>
<text x="445" y="176" font-size="18" font-weight="700" text-anchor="end" fill="#162638">Restart</text>
<path d="M442 183V238" stroke="#162638" stroke-width="2" stroke-dasharray="4 3"/>
<text x="270" y="221" font-size="18" font-weight="400" text-anchor="middle" fill="#164f86">WAL retained by slot</text>
<text x="30" y="262" font-size="17" font-weight="400" text-anchor="start" fill="#475569">Earlier</text>
<path d="M100 256H371m-7-5 7 5-7 5" fill="none" stroke="#64748b" stroke-width="1.5"/>
<text x="450" y="262" font-size="17" font-weight="400" text-anchor="end" fill="#475569">Later</text>
<text x="28" y="293" font-size="18" font-weight="400" text-anchor="start" fill="#162638">The slot keeps the required WAL.</text>
<text x="28" y="314" font-size="18" font-weight="400" text-anchor="start" fill="#162638">Disk usage grows while RDI is stopped.</text>
<text x="28" y="347" font-size="17" font-weight="400" text-anchor="start" fill="#475569">Disk used</text>
<rect x="146" y="346" width="32" height="5" rx="2" fill="#2563a6"/>
<rect x="191" y="342" width="32" height="9" rx="2" fill="#2563a6"/>
<rect x="236" y="338" width="32" height="13" rx="2" fill="#2563a6"/>
<rect x="281" y="334" width="32" height="17" rx="2" fill="#2563a6"/>
<rect x="326" y="330" width="32" height="21" rx="2" fill="#2563a6"/>
<rect x="12" y="380" width="456" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="28" y="411" font-size="21" font-weight="700" text-anchor="start" fill="#162638">2  History removed: cannot resume</text>
<text x="28" y="437" font-size="17" font-weight="400" text-anchor="start" fill="#475569">Capture stops; source writes continue</text>
<rect x="30" y="492" width="218" height="36" fill="url(#removed)" stroke="#94a3b8"/>
<rect x="248" y="492" width="202" height="36" fill="#dbeafe" stroke="#2563a6"/>
<text x="132" y="472" font-size="18" font-weight="700" text-anchor="middle" fill="#162638">Saved position</text>
<path d="M132 479V534" stroke="#162638" stroke-width="3"/>
<circle cx="132" cy="510" r="6" fill="#162638"/>
<text x="445" y="472" font-size="18" font-weight="700" text-anchor="end" fill="#162638">Restart</text>
<path d="M442 479V534" stroke="#162638" stroke-width="2" stroke-dasharray="4 3"/>
<text x="189" y="517" font-size="18" font-weight="400" text-anchor="middle" fill="#475569">Removed</text>
<text x="345" y="517" font-size="18" font-weight="400" text-anchor="middle" fill="#164f86">Retained</text>
<text x="30" y="558" font-size="17" font-weight="400" text-anchor="start" fill="#475569">Earlier</text>
<path d="M100 552H371m-7-5 7 5-7 5" fill="none" stroke="#64748b" stroke-width="1.5"/>
<text x="450" y="558" font-size="17" font-weight="400" text-anchor="end" fill="#475569">Later</text>
<text x="28" y="589" font-size="18" font-weight="400" text-anchor="start" fill="#162638">A slot limit allows WAL removal.</text>
<text x="28" y="610" font-size="18" font-weight="400" text-anchor="start" fill="#162638">The invalidated slot cannot resume.</text>
<rect x="12" y="676" width="456" height="280" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="28" y="707" font-size="21" font-weight="700" text-anchor="start" fill="#162638">3  Idle timeout: cannot resume</text>
<text x="28" y="733" font-size="17" font-weight="400" text-anchor="start" fill="#475569">Capture stops; source writes continue</text>
<rect x="30" y="788" width="30" height="36" fill="url(#removed)" stroke="#94a3b8"/>
<rect x="60" y="788" width="390" height="36" fill="#dbeafe" stroke="#2563a6"/>
<text x="132" y="768" font-size="18" font-weight="700" text-anchor="middle" fill="#162638">Saved position</text>
<path d="M132 775V830" stroke="#162638" stroke-width="3"/>
<circle cx="132" cy="806" r="6" fill="#162638"/>
<text x="445" y="768" font-size="18" font-weight="700" text-anchor="end" fill="#162638">Restart</text>
<path d="M442 775V830" stroke="#162638" stroke-width="2" stroke-dasharray="4 3"/>
<text x="270" y="813" font-size="18" font-weight="400" text-anchor="middle" fill="#164f86">WAL may still exist</text>
<text x="30" y="854" font-size="17" font-weight="400" text-anchor="start" fill="#475569">Earlier</text>
<path d="M100 848H371m-7-5 7 5-7 5" fill="none" stroke="#64748b" stroke-width="1.5"/>
<text x="450" y="854" font-size="17" font-weight="400" text-anchor="end" fill="#475569">Later</text>
<text x="28" y="885" font-size="18" font-weight="400" text-anchor="start" fill="#162638">PostgreSQL 18: enabled idle timeout</text>
<text x="28" y="906" font-size="18" font-weight="400" text-anchor="start" fill="#162638">invalidates the slot at a checkpoint.</text>
<text x="28" y="927" font-size="18" font-weight="400" text-anchor="start" fill="#162638">WAL availability alone is not enough.</text>
</g>
</svg>
