<text x="24" y="68" font-size="32" font-weight="600" fill="#FFFFFF" text-anchor="start">Snowflake</text>
<text x="24" y="98" font-size="18" font-weight="400" fill="#B9C2C6" text-anchor="start">Table history and identity · Preview</text>
