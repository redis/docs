<text x="68" y="44" font-size="24" font-weight="600" fill="#091A23" text-anchor="start">Table history available</text>
<text x="68" y="70" font-size="17" font-weight="400" fill="#5C707A" text-anchor="start">A stream refers to history; it does not copy it</text>
<rect x="24" y="126" width="136" height="52" rx="5" fill="#163341"/>
