<text x="122.0" y="233.0" font-size="17" font-weight="500" fill="#091A23" text-anchor="middle">Existing stream</text>
<path d="M226 227H352M346 223L352 227L346 231" fill="none" stroke="#D52D1F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/>
