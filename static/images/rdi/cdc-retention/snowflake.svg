<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1046" viewBox="0 0 480 1046" role="img" aria-labelledby="title desc">
<title id="title">Snowflake: Table history and identity · Preview</title>
<desc id="desc">A stream offset references retained versions of its source table. Removing required versions makes the stream stale. Replacing the source table is a separate failure: the old stream does not attach itself to a new table with the same name.</desc>
<defs><pattern id="removed" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#F9F9F9"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#B9C2C6" stroke-width="1"/></pattern></defs>
<style>@font-face{font-family:"CDC Space Grotesk";font-style:normal;font-weight:300 700;src:url(data:font/woff2;base64,) format("woff2");}</style>
<rect x=".5" y=".5" width="479" height="1045" rx="16" fill="#FFFFFF" stroke="#E8EBEC"/>
<path d="M16 0H464Q480 0 480 16V120H0V16Q0 0 16 0Z" fill="#091A23"/>
<g font-family="CDC Space Grotesk, Arial, sans-serif">
