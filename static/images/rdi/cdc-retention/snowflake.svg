<text x="56" y="220" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">The stream becomes stale.</text>
<text x="56" y="243" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">Increasing retention cannot restore versions.</text>
</g>
<g transform="translate(0 678)">
