<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1122" viewBox="0 0 480 1122" role="img" aria-labelledby="title desc">
<title id="title">Snowflake: Saved timestamps · Private preview</title>
<desc id="desc">RDI saves a table timestamp and recreates a stream from it when fetching changes. Available table history allows resume. Expired history or a saved timestamp before a replacement table existed prevents stream creation.</desc>
<defs><pattern id="removed" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#F9F9F9"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#B9C2C6" stroke-width="1"/></pattern></defs>
<style>@font-face{font-family:"CDC Space Grotesk";font-style:normal;font-weight:300 700;src:url(data:font/woff2;base64,) format("woff2");}</style>
<rect x=".5" y=".5" width="479" height="1121" rx="16" fill="#FFFFFF" stroke="#E8EBEC"/>
<path d="M16 0H464Q480 0 480 16V120H0V16Q0 0 16 0Z" fill="#091A23"/>
<g font-family="CDC Space Grotesk, Arial, sans-serif">
<rect x="24" y="23" width="32" height="4" rx="0" fill="#FF4438"/>
<text x="68" y="30" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="1.4">RDI / SOURCE HISTORY</text>
<text x="24" y="68" font-size="32" font-weight="600" fill="#FFFFFF" text-anchor="start">Snowflake</text>
<text x="24" y="98" font-size="18" font-weight="400" fill="#B9C2C6" text-anchor="start">Saved timestamps · Private preview</text>
<g transform="translate(0 132)">
<rect x="24" y="22" width="32" height="32" rx="6" fill="#DCFF1E"/>
<text x="40" y="45" font-size="16" font-weight="600" fill="#091A23" text-anchor="middle">01</text>
<text x="68" y="44" font-size="24" font-weight="600" fill="#091A23" text-anchor="start">Saved time is available</text>
<text x="68" y="70" font-size="17" font-weight="400" fill="#5C707A" text-anchor="start">Resume needs history from the saved time</text>
<rect x="24" y="126" width="136" height="52" rx="5" fill="#163341"/>
<text x="92.0" y="158.0" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">Friday</text>
<path d="M163 152H170M164 148L170 152L164 156" fill="none" stroke="#5C707A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="172" y="126" width="136" height="52" rx="5" fill="#163341"/>
<text x="240.0" y="158.0" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">Saturday</text>
<path d="M311 152H318M312 148L318 152L312 156" fill="none" stroke="#5C707A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="320" y="126" width="136" height="52" rx="5" fill="#163341"/>
<text x="388.0" y="158.0" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">Sunday</text>
<text x="92" y="96" font-size="17" font-weight="600" fill="#091A23" text-anchor="middle">Saved time</text>
<path d="M92 110V136" fill="none" stroke="#D52D1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M84 113H100V134L92 128L84 134Z" fill="#FF4438" stroke="#091A23"/>
<text x="24" y="210" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">RDI creates a stream at Friday’s timestamp.</text>
<circle cx="35" cy="252" r="10" fill="#DCFF1E"/>
<path d="M30 252L34 256L41 248" fill="none" stroke="#091A23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="258" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">The new stream can read missed changes.</text>
</g>
<g transform="translate(0 432)">
<path d="M24 0H456" fill="none" stroke="#E8EBEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="24" y="22" width="32" height="32" rx="6" fill="#091A23"/>
<text x="40" y="45" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">02</text>
<text x="68" y="44" font-size="24" font-weight="600" fill="#091A23" text-anchor="start">Saved time is too old</text>
<text x="68" y="70" font-size="17" font-weight="400" fill="#5C707A" text-anchor="start">Resume needs history from the saved time</text>
<rect x="24" y="126" width="136" height="52" rx="5" fill="url(#removed)" stroke="#B9C2C6"/>
<text x="92.0" y="158.0" font-size="17" font-weight="500" fill="#091A23" text-anchor="middle">Friday</text>
<path d="M163 152H170M164 148L170 152L164 156" fill="none" stroke="#5C707A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="172" y="126" width="136" height="52" rx="5" fill="#163341"/>
<text x="240.0" y="158.0" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">Saturday</text>
<path d="M311 152H318M312 148L318 152L312 156" fill="none" stroke="#5C707A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="320" y="126" width="136" height="52" rx="5" fill="#163341"/>
<text x="388.0" y="158.0" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">Sunday</text>
<text x="92" y="96" font-size="17" font-weight="600" fill="#091A23" text-anchor="middle">Saved time</text>
<path d="M92 110V136" fill="none" stroke="#D52D1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M84 113H100V134L92 128L84 134Z" fill="#FF4438" stroke="#091A23"/>
<text x="24" y="210" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">Friday’s table history is no longer available.</text>
<circle cx="35" cy="252" r="10" fill="#D52D1F"/>
<path d="M31 248L39 256M39 248L31 256" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="258" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">Stream creation at the saved time fails.</text>
</g>
<g transform="translate(0 732)">
<path d="M24 0H456" fill="none" stroke="#E8EBEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="24" y="22" width="32" height="32" rx="6" fill="#091A23"/>
<text x="40" y="45" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">03</text>
<text x="68" y="44" font-size="24" font-weight="600" fill="#091A23" text-anchor="start">The table is replaced</text>
<text x="68" y="70" font-size="17" font-weight="400" fill="#5C707A" text-anchor="start">Same name does not preserve old history</text>
<rect x="24" y="108" width="196" height="58" rx="5" fill="#163341"/>
<text x="122.0" y="143.0" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">Old table: orders</text>
<rect x="260" y="108" width="196" height="58" rx="5" fill="#163341"/>
<text x="358.0" y="143.0" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">New table: orders</text>
<path d="M226 137H254M248 133L254 137L248 141" fill="none" stroke="#5C707A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="204" font-size="18" font-weight="400" fill="#091A23" text-anchor="start">RDI uses the table now at that name.</text>
<text x="24" y="227" font-size="18" font-weight="400" fill="#091A23" text-anchor="start">If its history starts after the saved time:</text>
<circle cx="35" cy="279" r="10" fill="#D52D1F"/>
<path d="M31 275L39 283M39 275L31 283" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="285" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">Stream creation at the saved time fails.</text>
</g>
<path d="M24 1070H456" fill="none" stroke="#E8EBEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="1100" font-size="16" font-weight="400" fill="#5C707A" text-anchor="start">Illustrations · not retention defaults</text>
</g>
</svg>
