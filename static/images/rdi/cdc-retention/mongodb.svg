<svg xmlns="http://www.w3.org/2000/svg" width="480" height="732" viewBox="0 0 480 732" role="img" aria-labelledby="title desc">
<title id="title">MongoDB: Write volume changes the oplog time window</title>
<desc id="desc">Two equal-size oplogs at Sunday restart. With quiet writes, history still includes Friday’s resume token. With busy writes, the same capacity covers only Sunday and Friday’s position is no longer available.</desc>
