<text x="40" y="45" font-size="16" font-weight="600" fill="#091A23" text-anchor="middle">01</text>
<text x="68" y="44" font-size="24" font-weight="600" fill="#091A23" text-anchor="start">Both windows cover the work</text>
<text x="68" y="70" font-size="17" font-weight="400" fill="#5C707A" text-anchor="start">Snapshot reads and streaming need history</text>
<text x="24" y="145" font-size="17" font-weight="500" fill="#091A23" text-anchor="start">Row versions</text>
<text x="24" y="215" font-size="17" font-weight="500" fill="#091A23" text-anchor="start">Change records</text>
<rect x="160" y="126" width="288" height="28" rx="0" fill="#163341"/>
<path d="M196 112V162" fill="none" stroke="#D52D1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
