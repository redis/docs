<svg xmlns="http://www.w3.org/2000/svg" width="480" height="844" viewBox="0 0 480 844" role="img" aria-labelledby="title desc">
<title id="title">Spanner: change-stream history</title>
<desc id="desc">Illustrative Friday-to-Sunday interruption. A red bookmark marks the saved capture position. Solid dark blocks show retained history; hatched blocks show removed history. The first timeline can resume. The second cannot resume because required history is missing.</desc>
<defs><pattern id="removed" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#F9F9F9"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#B9C2C6" stroke-width="1"/></pattern></defs>
<style>@font-face{font-family:"CDC Space Grotesk";font-style:normal;font-weight:300 700;src:url(data:font/woff2;base64,) format("woff2");}</style>
<rect x=".5" y=".5" width="479" height="843" rx="16" fill="#FFFFFF" stroke="#E8EBEC"/>
<path d="M16 0H464Q480 0 480 16V120H0V16Q0 0 16 0Z" fill="#091A23"/>
<g font-family="CDC Space Grotesk, Arial, sans-serif">
<rect x="24" y="23" width="32" height="4" fill="#FF4438"/>
<text x="68" y="30" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="1.4">RDI / SOURCE HISTORY</text>
<text x="24" y="68" font-size="32" font-weight="600" fill="#FFFFFF" text-anchor="start">Spanner</text>
<text x="24" y="98" font-size="17" font-weight="400" fill="#B9C2C6" text-anchor="start">Positions in change-stream history</text>
<g transform="translate(0 132)">
<rect x="24" y="22" width="32" height="32" rx="6" fill="#DCFF1E"/>
<text x="40" y="45" font-size="16" font-weight="600" fill="#091A23" text-anchor="middle">01</text>
<text x="68" y="44" font-size="25" font-weight="600" fill="#091A23" text-anchor="start">History retained</text>
<text x="68" y="70" font-size="18" font-weight="500" fill="#5C707A" text-anchor="start">Resume succeeds</text>
<text x="24" y="105" font-size="17" font-weight="600" fill="#091A23" text-anchor="start">Resume point</text>
<text x="456" y="105" font-size="17" font-weight="600" fill="#091A23" text-anchor="end">Restart</text>
<rect x="24" y="128" width="24" height="32" fill="url(#removed)" stroke="#B9C2C6"/>
<rect x="48" y="128" width="408" height="32" fill="#163341"/>
