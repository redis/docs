<text x="160" y="105" font-size="16" font-weight="600" fill="#091A23" text-anchor="start">Saved point</text>
<text x="448" y="105" font-size="16" font-weight="600" fill="#091A23" text-anchor="end">Now</text>
<circle cx="35" cy="258" r="10" fill="#DCFF1E"/>
<path d="M30 258L34 262L41 254" fill="none" stroke="#091A23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="264" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">Required history remains in both windows.</text>
</g>
<g transform="translate(0 426)">
<path d="M24 0H456" fill="none" stroke="#E8EBEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
