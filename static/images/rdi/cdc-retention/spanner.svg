<path d="M188 185H204V206L196 200L188 206Z" fill="#FF4438" stroke="#091A23"/>
<text x="160" y="105" font-size="16" font-weight="600" fill="#091A23" text-anchor="start">Saved point</text>
<text x="448" y="105" font-size="16" font-weight="600" fill="#091A23" text-anchor="end">Now</text>
<circle cx="35" cy="258" r="10" fill="#D52D1F"/>
<path d="M31 254L39 262M39 254L31 262" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="264" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">Old snapshot reads fail; stream still exists.</text>
</g>
<g transform="translate(0 720)">
<path d="M24 0H456" fill="none" stroke="#E8EBEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="24" y="22" width="32" height="32" rx="6" fill="#091A23"/>
<text x="40" y="45" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">03</text>
<text x="68" y="44" font-size="24" font-weight="600" fill="#091A23" text-anchor="start">Streaming falls behind</text>
<text x="68" y="70" font-size="17" font-weight="400" fill="#5C707A" text-anchor="start">A finished snapshot cannot replay the gap</text>
<text x="24" y="145" font-size="17" font-weight="500" fill="#091A23" text-anchor="start">Row versions</text>
<text x="24" y="215" font-size="17" font-weight="500" fill="#091A23" text-anchor="start">Change records</text>
<text x="304" y="146" font-size="17" font-weight="500" fill="#5C707A" text-anchor="middle">Snapshot finished</text>
<rect x="160" y="196" width="124" height="28" rx="0" fill="url(#removed)" stroke="#B9C2C6"/>
<rect x="284" y="196" width="164" height="28" rx="0" fill="#163341"/>
