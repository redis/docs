<svg xmlns="http://www.w3.org/2000/svg" width="480" height="524" viewBox="0 0 480 524" role="img" aria-labelledby="title desc">
<title id="title">PostgreSQL: Preserve the slot’s state, not just its name</title>
<desc id="desc">A slot on the original primary has saved decoding state. After a failover without matching slot state, the new primary may have WAL but no usable continuation. Dropping and recreating a slot under the same name also does not restore its old state.</desc>
<defs><pattern id="removed" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#F9F9F9"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#B9C2C6" stroke-width="1"/></pattern></defs>
<style>@font-face{font-family:"CDC Space Grotesk";font-style:normal;font-weight:300 700;src:url(data:font/woff2;base64,) format("woff2");}</style>
<rect x=".5" y=".5" width="479" height="523" rx="16" fill="#FFFFFF" stroke="#E8EBEC"/>
<path d="M16 0H464Q480 0 480 16V120H0V16Q0 0 16 0Z" fill="#091A23"/>
<g font-family="CDC Space Grotesk, Arial, sans-serif">
<rect x="24" y="23" width="32" height="4" rx="0" fill="#FF4438"/>
<text x="68" y="30" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="1.4">RDI / SOURCE HISTORY</text>
<text x="24" y="68" font-size="32" font-weight="600" fill="#FFFFFF" text-anchor="start">PostgreSQL</text>
<text x="24" y="98" font-size="18" font-weight="400" fill="#B9C2C6" text-anchor="start">Preserve the slot’s state, not just its name</text>
<g transform="translate(0 132)">
<rect x="24" y="22" width="32" height="32" rx="6" fill="#091A23"/>
<text x="40" y="45" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">01</text>
<text x="68" y="44" font-size="24" font-weight="600" fill="#091A23" text-anchor="start">Slot state not preserved</text>
<text x="68" y="70" font-size="17" font-weight="400" fill="#5C707A" text-anchor="start">Example: failover without matching slot state</text>
<rect x="24" y="105" width="196" height="66" rx="5" fill="#163341"/>
<text x="122.0" y="134.0" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">Original primary</text>
<text x="122.0" y="154.0" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">Original slot state</text>
<rect x="260" y="105" width="196" height="66" rx="5" fill="#163341"/>
<text x="358.0" y="134.0" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">New primary</text>
<text x="358.0" y="154.0" font-size="17" font-weight="500" fill="#FFFFFF" text-anchor="middle">WAL exists</text>
<path d="M226 138H254M248 134L254 138L248 142" fill="none" stroke="#5C707A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M122 174V197" fill="none" stroke="#5C707A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M358 174V197" fill="none" stroke="#5C707A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="24" y="205" width="196" height="52" rx="5" fill="#DCFF1E"/>
<text x="122.0" y="237.0" font-size="17" font-weight="500" fill="#091A23" text-anchor="middle">Saved state exists</text>
<rect x="260" y="205" width="196" height="52" rx="5" fill="url(#removed)" stroke="#B9C2C6"/>
<text x="358.0" y="237.0" font-size="17" font-weight="500" fill="#091A23" text-anchor="middle">Slot state missing</text>
<circle cx="35" cy="287" r="10" fill="#D52D1F"/>
<path d="M31 283L39 291M39 283L31 291" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="293" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">Reusing a slot name does not restore it.</text>
<text x="56" y="316" font-size="17" font-weight="400" fill="#091A23" text-anchor="start">Check your failover and hosting setup.</text>
</g>
<path d="M24 472H456" fill="none" stroke="#E8EBEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="24" y="502" font-size="16" font-weight="400" fill="#5C707A" text-anchor="start">Illustrations · not retention defaults</text>
</g>
</svg>
