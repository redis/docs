<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="940" height="200" viewBox="0 0 940 200">
  <style>
    .bg { fill: #ffffff; }
    .node { fill: #ffffff; stroke: url(#border-gradient); stroke-width: 1; }
    .node-text { font: 14px 'trebuchet ms', verdana, arial, sans-serif; fill: #333333; }
    .edge { stroke: #333333; stroke-width: 2; fill: none; }
    .edge-label-bg { fill: #ffffff; }
    .edge-label { font: 13px 'trebuchet ms', verdana, arial, sans-serif; fill: #333333; }
  </style>
  <defs>
    <!-- Red-to-grey node border, matching the site's mermaid diagrams -->
    <linearGradient id="border-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ee0000" />
      <stop offset="100%" stop-color="#e5e5e5" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="940" height="200" />

  <!-- Edges -->
  <path class="edge" d="M 160 100 L 208 100" marker-end="url(#arrow)" />
  <path class="edge" d="M 290 100 C 320 100 305 40 335 40 L 538 40" marker-end="url(#arrow)" />
  <path class="edge" d="M 290 100 C 320 100 305 160 335 160 L 538 160" marker-end="url(#arrow)" />
  <path class="edge" d="M 740 40 C 765 40 765 94 788 94" marker-end="url(#arrow)" />
  <path class="edge" d="M 740 160 C 765 160 765 106 788 106" marker-end="url(#arrow)" />

  <!-- Edge labels, drawn over a gap in each edge -->
  <rect class="edge-label-bg" x="362" y="30" width="156" height="20" />
  <text class="edge-label" x="440" y="45" text-anchor="middle">matches SUBSCRIBE foo</text>
  <rect class="edge-label-bg" x="358" y="150" width="164" height="20" />
  <text class="edge-label" x="440" y="165" text-anchor="middle">matches PSUBSCRIBE f*</text>

  <!-- Nodes -->
  <rect class="node" x="10" y="80" width="150" height="40" />
  <text class="node-text" x="85" y="105" text-anchor="middle">PUBLISH foo Hello</text>

  <rect class="node" x="210" y="80" width="80" height="40" />
  <text class="node-text" x="250" y="105" text-anchor="middle">Redis</text>

  <rect class="node" x="540" y="20" width="200" height="40" />
  <text class="node-text" x="640" y="45" text-anchor="middle">message, foo, Hello</text>

  <rect class="node" x="540" y="140" width="200" height="40" />
  <text class="node-text" x="640" y="165" text-anchor="middle">pmessage, f*, foo, Hello</text>

  <rect class="node" x="790" y="80" width="140" height="40" rx="20" />
  <text class="node-text" x="860" y="105" text-anchor="middle">Subscribed client</text>
</svg>
