<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">RDI connects directly to RDS or Aurora through AWS PrivateLink</title>
<desc id="desc">RDI connects through a VPC endpoint, an endpoint service, and an internal network load balancer to the database writer. The target group stores the writer IP address. On an RDS event, SNS invokes Lambda. Lambda resolves the writer endpoint with DNS and updates the target group. Lambda does not carry database traffic. The load balancer and database have separate security groups. SNS and Lambda are shown outside the customer VPC.</desc>
<defs>
  <marker id="data-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#697f8a"/></marker>
  <marker id="control-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#765293"/></marker>
</defs>
<rect width="1440" height="760" fill="white"/>
<style>
text { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; fill: #172f3b; }
.box { fill: white; stroke: #8d9fa7; stroke-width: 2; }
.data { fill: none; stroke: #697f8a; stroke-width: 2.5; marker-end: url(#data-arrow); }
.control { fill: none; stroke: #765293; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#control-arrow); }
</style>
