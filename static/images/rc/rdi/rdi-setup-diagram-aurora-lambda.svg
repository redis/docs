<text x="942" y="515" font-size="17" text-anchor="end" >3. Update target IP</text>
<text x="880" y="713" font-size="20" text-anchor="middle" >Lambda keeps the target group pointed at the current writer.</text>
<text x="880" y="745" font-size="20" text-anchor="middle" >Database connections go through the NLB, not through Lambda.</text>
