fullnameOverride: playbook
tenantId: "<your-tenant-id>"
controlplane:
  image:
    repository: redislabs/iris-agent-playbook-control
    tag: "<playbook-image-version>"
  adminToken:
    existingSecret: playbook-controlplane-admin
  internalToken:
    existingSecret: playbook-controlplane-internal
dataplane:
  image:
    repository: redislabs/iris-agent-playbook-data
    tag: "<playbook-image-version>"
identityService:
  image:
    repository: redislabs/iris-identity-service
    tag: "<identity-service-image-version>"
  controlToken:
    existingSecret: playbook-identity-control
  runtimeToken:
    existingSecret: playbook-identity-runtime
license:
  existingSecret: playbook-license
storage:
  existingSecret: playbook-storage
inference:
  existingSecret: playbook-inference
  models:
    - provider: openai
      model: text-embedding-3-small
      dimensions: 1536
tests:
  enabled: true
